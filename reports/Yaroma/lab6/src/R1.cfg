enable
configure terminal
hostname R1
no ip domain-lookup
enable secret Lab6R1Enable
banner motd #Lab 6 variant 12 - R1#
line console 0
password Lab6R1Console
login
exit
interface FastEthernet0/0
description LAN towards PC1
ip address 192.168.1.13 255.255.255.0
no shutdown
exit
interface Serial0/1/0
description DCE towards R2
ip address 192.168.2.13 255.255.255.0
clock rate 64000
no shutdown
exit
end
copy running-config startup-config
