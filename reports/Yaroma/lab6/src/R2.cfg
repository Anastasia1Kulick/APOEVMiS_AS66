enable
configure terminal
hostname R2
no ip domain-lookup
enable secret Lab6R2Enable
banner motd #Lab 6 variant 12 - R2#
line console 0
password Lab6R2Console
login
exit
interface Serial0/1/0
description DTE towards R1
ip address 192.168.2.14 255.255.255.0
no shutdown
exit
interface FastEthernet0/0
description LAN towards PC2
ip address 192.168.3.13 255.255.255.0
no shutdown
exit
end
copy running-config startup-config
